name: Fetch News (InfinityVolume)

# Runs independently from the main data pipeline's own workflow, on its
# own 6-hour schedule, since news needs to refresh much more often than
# the once/twice-daily stock/treasury/macro data fetch. Also runnable
# manually via the "Run workflow" button in the Actions tab, useful for
# testing without waiting for the next scheduled trigger.
on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours, on the hour, UTC (00:00, 06:00, 12:00, 18:00)
  workflow_dispatch: {}

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run news fetch
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python scripts/news_fetch.py

      - name: Commit and push if _news.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/_news.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-update news feed"
          git push
